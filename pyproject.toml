    "langchain-mcp-adapters (==0.3.2)",
    "countryinfo (>=1.1.0,<2.0.0)",
    "langchain (>=1.5.2,<2.0.0)",
    "langchain-google-genai (>=4.5.2,<5.0.0)",
    "langgraph (>=1.2.24,<2.0.0)",
    "langchain-groq (>=1.2.1,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-huggingface (>=1.3.0,<2.0.0)",
    "langchain-text-splitters (>=1.2.0,<2.0.0)",
    "sentence-transformers (>=6.3.0,<7.0.0)",
